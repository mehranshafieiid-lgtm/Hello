name: Sync SONORA music cache

on:
  push:
    paths:
      - 'data/requests.json'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: sonora-music-cache
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch metadata and lyrics into GitHub
        run: node scripts/sync-library.mjs
      - name: Commit updated cache
        run: |
          git config user.name "SONORA GitHub Action"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/requests.json data/covers
          git diff --cached --quiet || git commit -m "Update SONORA music and lyrics cache"
          git push
